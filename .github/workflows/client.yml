name: Terminal client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests -q
      - run: shellcheck scripts/install.sh
      - run: uv run python -m build --wheel
  guided-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/test_windows_draft_io.py tests/test_windows_submission_journal.py tests/test_windows_artifact_publication.py tests/test_windows_source_snapshot.py tests/test_credential_transactions_issue_58.py tests/test_clerk_recovery_issue_11.py -q
